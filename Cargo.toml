[package]
name = "ruvio"
version = "0.3.4"
edition = "2024"
publish = false
authors = ["Salih Cantekin <17653555+salihcantekin@users.noreply.github.com>"]
description = "Memory-first key-value store with a tested subset of the Redis protocol"
license = "AGPL-3.0-only"
repository = "https://github.com/salihcantekin/ruvio"
homepage = "https://ruviodb.com/"
readme = "README.md"
keywords = ["redis", "database", "key-value"]
categories = ["database-implementations"]
exclude = [
    "/.github",
    "/site",
    "/clients",
    "/benchmark",
    "/profile",
    "/fuzz",
]

[lints.clippy]
# Every unsafe block says why it is sound; src/hashbrown keeps upstream's text instead.
undocumented_unsafe_blocks = "warn"

[features]
default = ["mimalloc-allocator", "coordinator"]
mimalloc-allocator = ["dep:mimalloc"]
# `ruvio coordinator`: automatic failover. Only that mode links the Raft library.
coordinator = ["dep:openraft"]

[dependencies]
ahash = "0.8"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
crc32c = "0.6"
memchr = "2"
mimalloc = { version = "0.1", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
blake3 = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha1 = "0.11.0"
mlua = { version = "0.12.1", default-features = false, features = ["lua51", "vendored"] }
rustls = "0.23"
tokio = { version = "1", default-features = false, features = ["net", "rt", "time", "io-util", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
# Already built for tokio; named here for TCP keepalive timing and the listen backlog.
socket2 = "0.6"
# Pinned: the API may change before 1.0. `storage-v2` opens the log and state machine traits.
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "storage-v2"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Only examples/03_zero_copy.rs uses it.
zerocopy = { version = "0.8", features = ["derive"] }
proptest = "1"
loom = "0.7"
tempfile = "3"
rcgen = "0.14"
iai-callgrind = "0.16.1"


[[bench]]
name = "hot_path"
harness = false

# Fat LTO and one codegen unit: measured SET and INCR gains with no GET regression.
# panic = "abort": a panicking shard ends the process instead of leaving a half-mutated shard serving.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"   # symbols for profiling, small size cost

[profile.bench]
inherits = "release"
panic = "unwind"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
