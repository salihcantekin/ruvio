# One replica. The process listens only after recovery, so a TCP probe is readiness.
# Create the secret first; no password is committed to this file:
#   kubectl create secret generic ruvio \
#     --from-literal=RUVIO_REQUIREPASS="$(openssl rand -hex 24)" \
# The published image defaults to RUVIO_PROTECTED_MODE=false and RUVIO_DURABILITY unset
# (memory). This manifest turns durability on. The image tag is checked against Cargo.toml
# by scripts/check_package_metadata.py; set it with scripts/release_version.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruvio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ruvio
  template:
    metadata:
      labels:
        app: ruvio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ruvio
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: salihcantekin/ruvio:0.4.0
          ports:
            - name: resp
              containerPort: 6379
          env:
            - name: RUVIO_ADDR
              value: 0.0.0.0:6379
            - name: RUVIO_DURABILITY
              value: everysec
            - name: RUVIO_DATA_DIR
              value: /data
            - name: RUVIO_REQUIREPASS
              valueFrom:
                secretKeyRef:
                  name: ruvio
                  key: RUVIO_REQUIREPASS
          readinessProbe:
            tcpSocket:
              port: resp
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: resp
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: resp
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ruvio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruvio-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ruvio
spec:
  selector:
    app: ruvio
  ports:
    - name: resp
      port: 6379
      targetPort: resp
