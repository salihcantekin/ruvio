# Example host config. It binds to loopback only; set requirepass before using another address.
# Loopback needs no password. A public bind needs requirepass.

address = "127.0.0.1:6379"
shards = 1

[connections]
max_global = 10000
max_per_ip = 256

[persistence]
profile = "everysec"
data_dir = "/var/lib/ruvio"

[security]
# requirepass = "..."   # required before binding to a non-loopback address
protected_mode = true
