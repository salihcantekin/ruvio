name: integration-packages

# Publish uses NuGet trusted publishing. The package job has id-token: write and exchanges that token through NuGet/login. There is no NUGET_API_KEY secret.
# Started from the dev branch, it builds previews: each package gets its next patch with a preview suffix and the
# run number (X.Y.Z-preview.N), stamped into the checkout only and never committed; NuGet lists them as pre-releases.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Integration package to build
        type: choice
        required: true
        options:
          - all
          - Ruvio.Extensions.Caching
          - Ruvio.AspNetCore.RateLimiting
          - Ruvio.AspNetCore.Idempotency
          - Ruvio.AspNetCore.OutputCaching
          - Ruvio.AspNetCore.DataProtection
          - Ruvio.AspNetCore.DistributedLock
          - Ruvio.Extensions.Idempotency
      publish:
        description: Publish to NuGet (required client version must already be published)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      # The tests run against the published server image, so the job needs no Rust build.
      # A dev run uses the `preview` image when one exists, else the last release.
      - name: Start Ruvio
        env:
          PREVIEW: ${{ github.ref_name == 'dev' }}
        run: |
          set -euo pipefail
          image=salihcantekin/ruvio:latest
          if [ "$PREVIEW" = "true" ] && docker pull --quiet salihcantekin/ruvio:preview; then
            image=salihcantekin/ruvio:preview
          fi
          docker run --detach --name ruvio-integrations \
            -e RUVIO_ALLOW_UNAUTHENTICATED=true -e RUVIO_DURABILITY=memory -e RUVIO_SHARDS=1 \
            --publish 127.0.0.1:16382:6379 "$image"
          docker exec ruvio-integrations ruvio --version
      - name: Stamp preview versions
        if: github.ref_name == 'dev'
        env:
          PACKAGE: ${{ inputs.package }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE" = "all" ]; then
            packages=(Ruvio.Extensions.Caching Ruvio.AspNetCore.RateLimiting Ruvio.AspNetCore.Idempotency Ruvio.AspNetCore.OutputCaching Ruvio.AspNetCore.DataProtection Ruvio.AspNetCore.DistributedLock Ruvio.Extensions.Idempotency)
          else
            packages=("$PACKAGE")
          fi
          for name in "${packages[@]}"; do
            version=$(python3 scripts/release_version.py "$name" --preview "$RUN_NUMBER")
            python3 scripts/release_version.py "$name" --stamp "$version"
            echo "$name $version"
          done
      - name: Refuse a version NuGet already has
        if: inputs.publish
        env:
          PACKAGE: ${{ inputs.package }}
        # The push uses --skip-duplicate, so an unchanged <Version> would publish nothing and still pass.
        run: |
          set -euo pipefail
          if [ "$PACKAGE" = "all" ]; then
            packages=(Ruvio.Extensions.Caching Ruvio.AspNetCore.RateLimiting Ruvio.AspNetCore.Idempotency Ruvio.AspNetCore.OutputCaching Ruvio.AspNetCore.DataProtection Ruvio.AspNetCore.DistributedLock Ruvio.Extensions.Idempotency)
          else
            packages=("$PACKAGE")
          fi
          for name in "${packages[@]}"; do
            version=$(python3 scripts/release_version.py "$name")
            lower=$(echo "$name" | tr '[:upper:]' '[:lower:]')
            published=$(curl -fsS "https://api.nuget.org/v3-flatcontainer/$lower/index.json" || echo '{"versions":[]}')
            if python3 -c 'import json,sys; sys.exit(0 if sys.argv[1] in json.loads(sys.argv[2])["versions"] else 1)' "$version" "$published"; then
              echo "::error::$name $version is already on NuGet. Run 'python3 scripts/release_version.py $name --write' (or --set X.Y.Z --write), commit, and start this workflow again."
              exit 1
            fi
          done
      - name: Verify and package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          export RUVIO_ADDR=127.0.0.1:16382
          export RUVIO_TEST_ADDR="$RUVIO_ADDR"
          python3 -c "import socket,time
          for _ in range(100):
              try:
                  with socket.create_connection(('127.0.0.1',16382), timeout=1) as s:
                      s.sendall(b'*1\r\n\$4\r\nPING\r\n')
                      if s.recv(64) == b'+PONG\r\n': break
              except OSError: pass
              time.sleep(0.1)
          else: raise SystemExit('Ruvio did not become ready')"
          if [ "$PACKAGE" = "all" ]; then
            packages=(
              Ruvio.Extensions.Caching
              Ruvio.AspNetCore.RateLimiting
              Ruvio.AspNetCore.Idempotency
              Ruvio.AspNetCore.OutputCaching
              Ruvio.AspNetCore.DataProtection
              Ruvio.AspNetCore.DistributedLock
              Ruvio.Extensions.Idempotency
            )
          else
            packages=("$PACKAGE")
          fi
          for name in "${packages[@]}"; do
            dotnet test "integrations/dotnet/$name.Tests/$name.Tests.csproj" -c Release
            dotnet pack "integrations/dotnet/$name/$name.csproj" -c Release -o dist -p:ContinuousIntegrationBuild=true
          done
      - name: Ruvio log
        if: failure()
        run: docker logs ruvio-integrations || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.package }}
          path: |
            dist/*.nupkg
            dist/*.snupkg
      - name: NuGet login
        if: inputs.publish
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: salihcantekin
      - name: Publish
        if: inputs.publish
        run: dotnet nuget push "dist/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

# Started by hand from the Actions tab only.
