name: release

# Manual only. Push and pull requests do not start this workflow.
#
# Secrets:
# DOCKERHUB_TOKEN — Docker Hub access token for the salihcantekin account. Used by the docker and docker-ui jobs.
#   Updating the repository description needs a token with Read, Write and Delete permission.
# CARGO_REGISTRY_TOKEN — crates.io API token. Used by the rust-client job.
# The server (crate `ruvio`) is not published to crates.io; its Cargo.toml has publish = false. Users get it as a Docker image or a GitHub Release binary.
# Server binaries: the server-binaries job builds ruvio and ruvio-ctl for Linux (x64, arm64), macOS (arm64) and Windows (x64), plus the UI host binaries.
#   They are attached to the GitHub Release when create_github_release is on; otherwise they stay as workflow artifacts.
# Every workflow in this repository is started by hand (workflow_dispatch); only pr-gate also runs on pull requests and pushes to main, and it publishes nothing.
# NuGet trusted publishing — the nuget job has id-token: write and exchanges that token through NuGet/login. There is no NUGET_API_KEY secret.
# npm trusted publishing — the npm job has id-token: write and publishes with the npm CLI (11.5.1 or newer), no NPM_TOKEN secret.
#   One-time setup: publish 0.1.0 by hand, then npmjs.com > ruvio-client > Settings > Trusted Publisher > GitHub Actions
#   (workflow release.yml, environment npm). Provenance is only produced for public repositories.
# PyPI trusted publishing — the pypi job has id-token: write and uses pypa/gh-action-pypi-publish, no PYPI_TOKEN secret.
#   One-time setup: pypi.org > Publishing > pending publisher (project ruvio-client, workflow release.yml, environment pypi).
# Maven Central — the maven job signs and uploads through the Central Portal. Secrets: CENTRAL_USERNAME and CENTRAL_PASSWORD
#   (Portal user token), GPG_PRIVATE_KEY (armored), GPG_PASSPHRASE. Environment: maven. Central has no OIDC publishing.
# Go has no registry; its client is not part of this workflow yet.
# GITHUB_TOKEN — built-in token, not a repository secret. Pushes the version commit and creates the GitHub Release when that option is on.
#
# Preview releases: started from the dev branch, the workflow publishes previews. Each package
# gets the next patch with a preview suffix and the run number (X.Y.Z-preview.N; PyPI X.Y.Z.devN;
# Maven X.Y.Z-rc.N, a qualifier Maven sorts before the release, as Central has no pre-release flag):
# NuGet and crates.io list it as a pre-release, npm publishes it under the
# `preview` dist-tag, Docker pushes the `preview` tag (never `latest`), and the GitHub Release
# is marked pre-release. Nothing is committed: the versions are stamped into the checkout of
# each job only, and CHANGELOG notes stay under "Unreleased". Version inputs are ignored
# except as the base (X.Y.Z) when filled.
#
# Leave a version input empty to bump that package's patch number. Exception: docker, server-binaries,
# docker-ui and ui-host run alone need their version filled in, because each pair shares one version.
# Fill it (1.2.3 or v1.2.3) to publish that exact version. A new version also moves the package's CHANGELOG.md
# "Unreleased" notes under that version, and server-binaries points the README and site download lines at it.
# server_version is the ruvio image tag.
# rust_client_version is the ruvio-client crate.
# csharp_version is Ruvio.Client and Ruvio.Client.AspNetCore together.
# ui_version is the ruvio-ui image tag.
# node_version is the npm package ruvio-client, python_version the PyPI package ruvio-client,
# java_version the Maven artifact io.github.salihcantekin:ruvio-client.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to publish
        type: choice
        options:
          - all
          - docker
          - docker-ui
          - rust-client
          - nuget
          - server-binaries
          - ui-host
          - npm
          - pypi
          - maven
        required: true
        default: all
      server_version:
        description: Server image version. Empty bumps the patch.
        type: string
        default: ""
        required: false
      rust_client_version:
        description: Rust client crate version. Empty bumps the patch.
        type: string
        default: ""
        required: false
      csharp_version:
        description: C# package version. Empty bumps the patch.
        type: string
        default: ""
        required: false
      ui_version:
        description: UI image version. Empty bumps the patch.
        type: string
        default: ""
        required: false
      node_version:
        description: npm package version. Empty bumps the patch.
        type: string
        default: ""
        required: false
      python_version:
        description: PyPI package version. Empty bumps the patch.
        type: string
        default: ""
        required: false
      java_version:
        description: Maven artifact version. Empty bumps the patch.
        type: string
        default: ""
        required: false
      maven_auto_publish:
        description: Release to Maven Central right after validation. Off leaves the deployment waiting in the Central Portal for a manual Publish click.
        type: boolean
        default: false
        required: false
      create_github_release:
        description: Also create a GitHub Release. The tag defaults to ruvio-<server version>.
        type: boolean
        default: false
        required: false
      git_tag:
        description: GitHub Release tag. Used only when the release option is on. Empty uses ruvio-<server version>.
        type: string
        default: ""
        required: false

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      server: ${{ steps.publish.outputs.server }}
      rust_client: ${{ steps.publish.outputs.rust_client }}
      csharp: ${{ steps.publish.outputs.csharp }}
      ui: ${{ steps.publish.outputs.ui }}
      node: ${{ steps.publish.outputs.node }}
      python: ${{ steps.publish.outputs.python }}
      java: ${{ steps.publish.outputs.java }}
      preview: ${{ steps.publish.outputs.preview }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Check package metadata
        run: python3 scripts/check_package_metadata.py
      - id: publish
        env:
          TARGET: ${{ inputs.target }}
          SERVER_VERSION: ${{ inputs.server_version }}
          RUST_CLIENT_VERSION: ${{ inputs.rust_client_version }}
          CSHARP_VERSION: ${{ inputs.csharp_version }}
          UI_VERSION: ${{ inputs.ui_version }}
          NODE_VERSION: ${{ inputs.node_version }}
          PYTHON_VERSION: ${{ inputs.python_version }}
          JAVA_VERSION: ${{ inputs.java_version }}
          # A run from dev publishes previews; see the header.
          PREVIEW: ${{ github.ref_name == 'dev' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          target="$TARGET"
          if [ "$PREVIEW" = "true" ]; then
            preview() { python3 scripts/release_version.py "$1" --set "$2" --preview "$RUN_NUMBER"; }
            {
              echo "preview=true"
              echo "server=$(preview server "$SERVER_VERSION")"
              echo "rust_client=$(preview rust-client "$RUST_CLIENT_VERSION")"
              echo "csharp=$(preview csharp "$CSHARP_VERSION")"
              echo "ui=$(preview ui "$UI_VERSION")"
              echo "node=$(preview node "$NODE_VERSION")"
              echo "python=$(preview python "$PYTHON_VERSION")"
              echo "java=$(preview java "$JAVA_VERSION")"
              echo "sha=${GITHUB_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "preview=false" >> "$GITHUB_OUTPUT"
          # docker and server-binaries share the server version, docker-ui and ui-host the UI version.
          # An empty version bumps the patch, so publishing one half of a pair and then the other
          # with empty inputs would ship two different versions. Outside `all`, ask for it explicitly.
          case "$target" in
            docker|server-binaries)
              if [ -z "$SERVER_VERSION" ]; then
                echo "::error::$target needs server_version (the image and the binaries must share one version; current: $(python3 scripts/release_version.py server))"
                exit 1
              fi
              ;;
            docker-ui|ui-host)
              if [ -z "$UI_VERSION" ]; then
                echo "::error::$target needs ui_version (the UI image and host binaries must share one version; current: $(python3 scripts/release_version.py ui))"
                exit 1
              fi
              ;;
          esac
          flag() {
            if [ "$target" = "all" ] || [ "$target" = "$1" ] || [ "$target" = "$2" ]; then
              echo --write
            fi
          }
          read -r -a server_flag <<< "$(flag docker server-binaries)"
          read -r -a rust_client_flag <<< "$(flag rust-client rust-client)"
          read -r -a csharp_flag <<< "$(flag nuget nuget)"
          read -r -a ui_flag <<< "$(flag docker-ui ui-host)"
          # The README and site download lines name a GitHub Release, so they move only with the binaries.
          if [ "$target" = "all" ] || [ "$target" = "server-binaries" ]; then
            server_flag+=(--install-pins)
          fi
          server=$(python3 scripts/release_version.py server --set "$SERVER_VERSION" "${server_flag[@]}")
          rust_client=$(python3 scripts/release_version.py rust-client --set "$RUST_CLIENT_VERSION" "${rust_client_flag[@]}")
          csharp=$(python3 scripts/release_version.py csharp --set "$CSHARP_VERSION" "${csharp_flag[@]}")
          ui=$(python3 scripts/release_version.py ui --set "$UI_VERSION" "${ui_flag[@]}")
          read -r -a node_flag <<< "$(flag npm npm)"
          read -r -a python_flag <<< "$(flag pypi pypi)"
          read -r -a java_flag <<< "$(flag maven maven)"
          node=$(python3 scripts/release_version.py node --set "$NODE_VERSION" "${node_flag[@]}")
          python=$(python3 scripts/release_version.py python --set "$PYTHON_VERSION" "${python_flag[@]}")
          java=$(python3 scripts/release_version.py java --set "$JAVA_VERSION" "${java_flag[@]}")
          {
            echo "server=$server"
            echo "rust_client=$rust_client"
            echo "csharp=$csharp"
            echo "ui=$ui"
            echo "node=$node"
            echo "python=$python"
            echo "java=$java"
          } >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add Cargo.toml Cargo.lock clients/ruvio-client/Cargo.toml clients/ruvio-client/Cargo.lock clients/ruvio-ui/Cargo.toml clients/ruvio-ui/Cargo.lock clients/csharp/Ruvio.Client/Ruvio.Client.csproj clients/csharp/Ruvio.Client.AspNetCore/Ruvio.Client.AspNetCore.csproj clients/node/package.json clients/node/package-lock.json clients/python/pyproject.toml clients/python/ruvio/__init__.py clients/java/pom.xml docs/compatibility-matrix.json \
            CHANGELOG.md clients/ruvio-client/CHANGELOG.md clients/csharp/CHANGELOG.md clients/ruvio-ui/CHANGELOG.md clients/node/CHANGELOG.md clients/python/CHANGELOG.md clients/java/CHANGELOG.md \
            README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Set release versions to server ${server}, rust client ${rust_client}, C# ${csharp}, UI ${ui}, npm ${node}, PyPI ${python}, and Maven ${java}."
          git push origin HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Each architecture builds on its own runner (no emulation) and pushes by digest;
  # docker-manifest then puts both under the version tags.
  docker:
    needs: versions
    if: inputs.target == 'all' || inputs.target == 'docker'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: salihcantekin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Stamp the preview version
        if: needs.versions.outputs.preview == 'true'
        run: python3 scripts/release_version.py server --stamp "${{ needs.versions.outputs.server }}"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.linux
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=salihcantekin/ruvio,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ruvio-server-${{ matrix.arch }}
          cache-to: type=gha,scope=ruvio-server-${{ matrix.arch }},mode=max
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v6
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  docker-manifest:
    needs: [versions, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: actions/download-artifact@v7
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: salihcantekin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag both architectures
        env:
          SERVER: ${{ needs.versions.outputs.server }}
          PREVIEW: ${{ needs.versions.outputs.preview }}
        run: |
          set -euo pipefail
          # A preview moves only the `preview` tag; `linux` and `latest` stay on the last release.
          tags=(-t "salihcantekin/ruvio:$SERVER")
          if [ "$PREVIEW" = "true" ]; then
            tags+=(-t salihcantekin/ruvio:preview)
          else
            tags+=(-t salihcantekin/ruvio:linux -t salihcantekin/ruvio:latest)
          fi
          sources=()
          for d in digests/*; do
            sources+=("salihcantekin/ruvio@sha256:$(basename "$d")")
          done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect --raw "salihcantekin/ruvio:$SERVER" | python3 -c 'import json,sys; p={m["platform"]["architecture"] for m in json.load(sys.stdin)["manifests"]}; print(sorted(p)); assert {"amd64","arm64"} <= p, p'
      # The image is already out when this runs, so a token without description rights warns instead of failing the release.
      - name: Docker Hub description
        if: needs.versions.outputs.preview != 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: salihcantekin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: salihcantekin/ruvio
          short-description: Memory-first key-value server that speaks the Redis protocol (RESP2).
          readme-filepath: docker/hub/ruvio.md
      - name: Verify the Docker Hub page
        if: needs.versions.outputs.preview != 'true'
        run: |
          set -euo pipefail
          curl -fsS https://hub.docker.com/v2/repositories/salihcantekin/ruvio/ | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["description"] and "AGPL" in d["full_description"], "Docker Hub description is missing"'

  docker-ui:
    needs: versions
    if: inputs.target == 'all' || inputs.target == 'docker-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: salihcantekin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Stamp the preview version
        if: needs.versions.outputs.preview == 'true'
        run: python3 scripts/release_version.py ui --stamp "${{ needs.versions.outputs.ui }}"
      - uses: docker/build-push-action@v7
        with:
          context: clients
          file: clients/ruvio-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            salihcantekin/ruvio-ui:${{ needs.versions.outputs.ui }}
            ${{ needs.versions.outputs.preview == 'true' && 'salihcantekin/ruvio-ui:preview' || 'salihcantekin/ruvio-ui:linux' }}
            ${{ needs.versions.outputs.preview != 'true' && 'salihcantekin/ruvio-ui:latest' || '' }}
          cache-from: type=gha,scope=ruvio-ui
          cache-to: type=gha,scope=ruvio-ui,mode=max
      - name: Docker Hub description
        if: needs.versions.outputs.preview != 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: salihcantekin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: salihcantekin/ruvio-ui
          short-description: Browser operator console for a Ruvio server.
          readme-filepath: docker/hub/ruvio-ui.md
      - name: Verify the Docker Hub page
        if: needs.versions.outputs.preview != 'true'
        run: |
          set -euo pipefail
          curl -fsS https://hub.docker.com/v2/repositories/salihcantekin/ruvio-ui/ | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["description"] and "AGPL" in d["full_description"], "Docker Hub description is missing"'

  rust-client:
    needs: versions
    if: inputs.target == 'all' || inputs.target == 'rust-client'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          workspaces: clients/ruvio-client
      - name: Stamp the preview version
        if: needs.versions.outputs.preview == 'true'
        run: python3 scripts/release_version.py rust-client --stamp "${{ needs.versions.outputs.rust_client }}"
      - run: cargo test --manifest-path clients/ruvio-client/Cargo.toml --locked
      # A stamped preview leaves the manifest changed in the checkout: --allow-dirty.
      - run: cargo publish --locked --manifest-path clients/ruvio-client/Cargo.toml ${{ needs.versions.outputs.preview == 'true' && '--allow-dirty' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  nuget:
    needs: versions
    if: inputs.target == 'all' || inputs.target == 'nuget'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Stamp the preview version
        if: needs.versions.outputs.preview == 'true'
        run: python3 scripts/release_version.py csharp --stamp "${{ needs.versions.outputs.csharp }}"
      - run: dotnet test clients/csharp/Ruvio.Client.Tests/Ruvio.Client.Tests.csproj
      - run: dotnet test clients/csharp/Ruvio.Client.AspNetCore.Tests/Ruvio.Client.AspNetCore.Tests.csproj
      - run: dotnet pack clients/csharp/Ruvio.Client/Ruvio.Client.csproj -c Release -o dist
      - run: dotnet pack clients/csharp/Ruvio.Client.AspNetCore/Ruvio.Client.AspNetCore.csproj -c Release -o dist
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: salihcantekin
      - run: dotnet nuget push "dist/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  server-binary:
    needs: versions
    if: inputs.target == 'all' || inputs.target == 'npm' || inputs.target == 'pypi' || inputs.target == 'maven'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          key: cluster-server
      - run: cargo build --locked --bin ruvio
      - uses: actions/upload-artifact@v6
        with:
          name: ruvio-server
          path: target/debug/ruvio
          retention-days: 1

  npm:
    needs: [versions, server-binary]
    if: inputs.target == 'all' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: ruvio-server
          path: server-bin
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: chmod +x server-bin/ruvio
      - name: Stamp the preview version
        if: needs.versions.outputs.preview == 'true'
        run: python3 scripts/release_version.py node --stamp "${{ needs.versions.outputs.node }}"
      - name: Trusted publishing needs npm 11.5.1 or newer
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
        working-directory: clients/node
      - name: Test against a live server
        run: scripts/run_with_servers.sh "$PWD/server-bin/ruvio" 17400 -- npm test --prefix clients/node
      - name: Publish (OIDC, no token)
        working-directory: clients/node
        # A preview goes under the `preview` dist-tag, so `npm install ruvio-client` keeps the release.
        run: npm publish --access public ${{ needs.versions.outputs.preview == 'true' && '--tag preview' || '' }}

  pypi:
    needs: [versions, server-binary]
    if: inputs.target == 'all' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: ruvio-server
          path: server-bin
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: chmod +x server-bin/ruvio
      - name: Stamp the preview version
        if: needs.versions.outputs.preview == 'true'
        run: python3 scripts/release_version.py python --stamp "${{ needs.versions.outputs.python }}"
      - run: python -m pip install "./clients/python[test]" build twine
      - name: Test against a live server
        run: scripts/run_with_servers.sh "$PWD/server-bin/ruvio" 17400 -- python -m pytest -q clients/python
      - name: Build and check the distribution
        run: |
          python -m build --outdir dist-py clients/python
          python -m twine check dist-py/*
      - name: Publish (trusted publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py

  maven:
    needs: [versions, server-binary]
    if: inputs.target == 'all' || inputs.target == 'maven'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: maven
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: ruvio-server
          path: server-bin
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: chmod +x server-bin/ruvio
      - name: Stamp the preview version
        if: needs.versions.outputs.preview == 'true'
        run: python3 scripts/release_version.py java --stamp "${{ needs.versions.outputs.java }}"
      - name: Test against a live server
        run: scripts/run_with_servers.sh "$PWD/server-bin/ruvio" 17400 -- mvn -B -f clients/java/pom.xml verify
      - name: Build and sign the Maven artifacts
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -f clients/java/pom.xml -P release verify -DskipTests
      - name: Upload to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: scripts/central_upload.sh ${{ inputs.maven_auto_publish && 'automatic' || 'user-managed' }}

  server-binaries:
    needs: versions
    if: inputs.target == 'all' || inputs.target == 'server-binaries'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            ext: tar.gz
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            ext: tar.gz
          - os: macos-latest
            platform: macos-arm64
            ext: tar.gz
          - os: windows-latest
            platform: windows-x64
            ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          key: server-binaries-${{ matrix.platform }}
      - name: Stamp the preview version
        if: needs.versions.outputs.preview == 'true'
        # Windows runners name the interpreter python.
        run: '"$(command -v python3 || command -v python)" scripts/release_version.py server --stamp "${{ needs.versions.outputs.server }}"'
      - name: Build
        run: cargo build --locked --release --bin ruvio --bin ruvio-ctl
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          bin=target/release/ruvio
          [ -f "$bin.exe" ] && bin="$bin.exe"
          data="$(mktemp -d)"
          "$bin" --address 127.0.0.1:16999 --data-dir "$data" &
          pid=$!
          sleep 3
          py="$(command -v python3 || command -v python)"
          "$py" - <<'PY'
          import socket
          s = socket.create_connection(("127.0.0.1", 16999), timeout=5)
          s.sendall(b"*1\r\n$4\r\nPING\r\n")
          reply = s.recv(64)
          assert reply == b"+PONG\r\n", reply
          PY
          kill "$pid" || true
          rm -f ruvio.toml
      - name: Package
        run: |
          set -euo pipefail
          name="ruvio-${{ needs.versions.outputs.server }}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          for tool in ruvio ruvio-ctl; do
            if [ -f "target/release/$tool.exe" ]; then cp "target/release/$tool.exe" "dist/$name/"; else cp "target/release/$tool" "dist/$name/"; fi
          done
          cp LICENSE README.md "dist/$name/"
          cp ruvio.example.toml "dist/$name/"
          cp docs/UI_CONNECTIONS.md "dist/$name/"
          cd dist
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: release-server-${{ matrix.platform }}
          path: dist/ruvio-*.${{ matrix.ext }}

  ui-host:
    needs: versions
    if: inputs.target == 'all' || inputs.target == 'ui-host'
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ruvio-ui-linux-x64
            binary: clients/ruvio-ui/target/release/ruvio-ui
          - os: macos-latest
            artifact: ruvio-ui-macos-arm64
            binary: clients/ruvio-ui/target/release/ruvio-ui
          - os: windows-latest
            artifact: ruvio-ui-windows-x64
            binary: clients/ruvio-ui/target/release/ruvio-ui.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ruvio-ui/web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          workspaces: clients/ruvio-ui
      - name: Build the screens
        working-directory: clients/ruvio-ui/web
        run: npm ci && npm run build
      - name: Stamp the preview version
        if: needs.versions.outputs.preview == 'true'
        shell: bash
        run: '"$(command -v python3 || command -v python)" scripts/release_version.py ui --stamp "${{ needs.versions.outputs.ui }}"'
      - name: Build the host binary
        run: cargo build --locked --release --manifest-path clients/ruvio-ui/Cargo.toml
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.artifact }}-${{ needs.versions.outputs.ui }}"
          mkdir -p "dist/$name"
          cp "${{ matrix.binary }}" "dist/$name/"
          cp clients/ruvio-ui/LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  github-release:
    needs: [versions, docker, docker-manifest, docker-ui, rust-client, nuget, server-binaries, ui-host, npm, pypi, maven]
    if: >-
      !cancelled() &&
      inputs.create_github_release &&
      needs.versions.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped') &&
      (needs.docker-manifest.result == 'success' || needs.docker-manifest.result == 'skipped') &&
      (needs.docker-ui.result == 'success' || needs.docker-ui.result == 'skipped') &&
      (needs.rust-client.result == 'success' || needs.rust-client.result == 'skipped') &&
      (needs.nuget.result == 'success' || needs.nuget.result == 'skipped') &&
      (needs.server-binaries.result == 'success' || needs.server-binaries.result == 'skipped') &&
      (needs.ui-host.result == 'success' || needs.ui-host.result == 'skipped') &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped') &&
      (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') &&
      (needs.maven.result == 'success' || needs.maven.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.versions.outputs.sha }}
      - name: Collect the binaries
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          ls -1
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] && sha256sum "$f"
          done > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inputs and outputs reach the script as variables, never as script text.
          GIT_TAG: ${{ inputs.git_tag }}
          SERVER: ${{ needs.versions.outputs.server }}
          RUST_CLIENT: ${{ needs.versions.outputs.rust_client }}
          CSHARP: ${{ needs.versions.outputs.csharp }}
          UI: ${{ needs.versions.outputs.ui }}
          NODE: ${{ needs.versions.outputs.node }}
          PYTHON: ${{ needs.versions.outputs.python }}
          JAVA: ${{ needs.versions.outputs.java }}
          PREVIEW: ${{ needs.versions.outputs.preview }}
          SHA: ${{ needs.versions.outputs.sha }}
        run: |
          set -euo pipefail
          tag="$GIT_TAG"
          prerelease=()
          if [ "$PREVIEW" = "true" ]; then
            prerelease=(--prerelease)
          fi
          if [ -z "$tag" ]; then
            tag="ruvio-$SERVER"
          fi
          # The tag goes on the commit the assets were built from (a new tag would otherwise land on main).
          gh release create "$tag" "${prerelease[@]}" --target "$SHA" --title "$tag" --notes "$(cat <<EOF
          Server $SERVER
          Rust client $RUST_CLIENT
          C# $CSHARP
          UI $UI
          npm $NODE
          PyPI $PYTHON
          Maven $JAVA
          EOF
          )" release-assets/*

