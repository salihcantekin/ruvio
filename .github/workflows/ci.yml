name: CI

# Manual only. Push and pull requests do not start this workflow.
# Secrets: none.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run: all, or a comma list of test, supply-chain, container, clients, apps, fuzz, asan, miri, instruction-baseline (not part of all)"
        type: string
        default: all
      os:
        description: Operating system for the test job
        type: choice
        options: [all, ubuntu-latest, macos-latest, windows-latest]
        default: all

permissions:
  contents: read

jobs:
  test:
    if: inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',test,')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["macos-latest","ubuntu-latest","windows-latest"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # A smaller random sample keeps the property tests quick; run them with the default 256 locally.
      PROPTEST_CASES: "32"
      # Debug info roughly doubles compile and link time (most on Windows) and the cache size.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-nextest
      # Lints do not depend on the OS, and Windows and macOS minutes cost more.
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets --all-features -- -D warnings
        if: runner.os == 'Linux'
      # Each test in its own process with a time limit (.config/nextest.toml), so a hang
      # fails with the test's name, and every failing test is listed, not only the first binary's.
      - name: Tests
        run: cargo nextest run --locked --profile ci --lib --bins --tests
        timeout-minutes: 25
      - run: cargo run --example 04_store_smoke

  supply-chain:
    if: inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',supply-chain,')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - run: python3 scripts/test_supply_chain.py
      - run: python3 scripts/test_release_version.py
      - run: python3 scripts/generate_sbom.py --output /tmp/ruvio-sbom.cdx.json

  container:
    if: inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',container,')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          python3 -m py_compile
          scripts/cluster_smoke.py
          scripts/churn_benchmark.py
          scripts/benchmark_shards.py
          scripts/benchmark_regression.py
          scripts/test_benchmark_regression.py
          scripts/resp_conformance.py
          scripts/redis_differential.py
          scripts/_ruvio.py
          scripts/docker_resilience.py
          scripts/native_resilience.py
          scripts/check_compatibility_matrix.py
          scripts/test_compatibility_matrix.py
          scripts/run_client_suites.py
          scripts/generate_sbom.py
          scripts/test_supply_chain.py
          scripts/test_release_version.py
      - run: python3 scripts/test_benchmark_regression.py
      - run: python3 scripts/test_release_version.py
      - run: python3 scripts/check_compatibility_matrix.py
      - run: python3 scripts/test_compatibility_matrix.py
      - run: bash -n scripts/benchmark.sh scripts/profile_linux.sh scripts/run_sanitizers.sh scripts/test.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Dockerfile and Dockerfile.linux build the same server, and the release
      # publishes Dockerfile.linux, so one image serves every check below. Its
      # dependency layer is cached, so a source change rebuilds only the crate.
      # The checks are behavioral, so the image skips fat LTO, which alone takes
      # minutes; the release workflow builds the published image with it.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.linux
          load: true
          build-args: |
            CARGO_ARGS=--config=profile.release.lto=false --config=profile.release.codegen-units=16 --config=profile.release.debug=0
          tags: |
            ruvio
            ruvio:evented
          cache-from: |
            type=gha,scope=ci-ruvio-evented
            type=gha,scope=ruvio-server
          cache-to: type=gha,scope=ci-ruvio-evented,mode=max
      - run: docker run --detach --name ruvio-test -e RUVIO_ALLOW_UNAUTHENTICATED=true --publish 16379:6379 ruvio
      - name: Verify RESP endpoint
        run: python3 scripts/resp_conformance.py --port 16379
      - run: docker run --detach --name redis-reference --publish 16380:6379 redis:7-alpine
      - name: Reset Ruvio so the differential starts empty
        run: |
          docker restart ruvio-test
          python3 scripts/_ruvio.py wait-ready --timeout 30 --port 16379
      - name: Verify Redis differential behavior
        run: >-
          python3 scripts/redis_differential.py
          --ruvio-port 16379 --redis-port 16380
      - if: always()
        run: docker logs ruvio-test || true
      - if: always()
        run: docker rm --force ruvio-test redis-reference
      - name: Start evented standalone
        run: >-
          docker run --detach --name ruvio-evented-test
          -e RUVIO_ALLOW_UNAUTHENTICATED=true
          -p 16383:6379
          ruvio:evented
      - name: Verify evented conformance
        run: python3 scripts/resp_conformance.py --port 16383
      - if: always()
        run: docker logs ruvio-evented-test || true
      - if: always()
        run: docker rm --force ruvio-evented-test
      - name: Start evented cluster
        run: >-
          docker run --detach --name ruvio-evented-cluster-test
          -e RUVIO_ALLOW_UNAUTHENTICATED=true
          -e RUVIO_SHARDS=2
          -e RUVIO_PORT_MODE=per-shard
          -e RUVIO_ADVERTISE_HOST=127.0.0.1
          -p 6379:6379 -p 6380:6380
          ruvio:evented
      - name: Verify evented cluster routing
        run: python3 scripts/cluster_smoke.py
      - if: always()
        run: docker logs ruvio-evented-cluster-test || true
      - if: always()
        run: docker rm --force ruvio-evented-cluster-test

  clients:
    if: inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',clients,')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go/go.mod
          # The module has no dependencies (no go.sum) to cache.
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            .
            clients/ruvio-client
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('clients/csharp/**/*.csproj', 'integrations/dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: python3 scripts/check_compatibility_matrix.py
      - run: cargo build --locked --bin ruvio
      # Each step starts a standalone server and a 3-shard per-shard cluster (RUVIO_TEST_ADDR,
      # RUVIO_CLUSTER_ADDR), so every client's live and cluster tests run, and stops them after.
      - name: Rust client
        timeout-minutes: 15
        run: scripts/run_with_servers.sh "$PWD/target/debug/ruvio" 17400 -- cargo test --locked --manifest-path clients/ruvio-client/Cargo.toml
      # The TLS tests need the `tls` feature and the TLS servers the script starts.
      - name: Rust client over TLS
        timeout-minutes: 15
        run: scripts/run_with_servers.sh "$PWD/target/debug/ruvio" 17400 -- cargo test --locked --manifest-path clients/ruvio-client/Cargo.toml --features tls --test tls_live
      - name: C# client and .NET integrations
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC2016 # the inner script expands its own variables
          scripts/run_with_servers.sh "$PWD/target/debug/ruvio" 17420 -- bash -c '
            set -euo pipefail
            for project in clients/csharp/Ruvio.Client.Tests clients/csharp/Ruvio.Client.AspNetCore.Tests integrations/dotnet/*.Tests; do
              dotnet test "$project" --nologo --blame-hang-timeout 5m
            done'
      - name: Go client
        timeout-minutes: 15
        run: scripts/run_with_servers.sh "$PWD/target/debug/ruvio" 17440 -- bash -c 'cd clients/go && go test -race -count=1 -timeout 600s ./...'
      - name: Java client
        timeout-minutes: 15
        run: scripts/run_with_servers.sh "$PWD/target/debug/ruvio" 17460 -- mvn -B -f clients/java/pom.xml verify
      - name: Node client
        timeout-minutes: 15
        run: |
          npm ci --prefix clients/node
          scripts/run_with_servers.sh "$PWD/target/debug/ruvio" 17480 -- npm test --prefix clients/node
      - name: Python client
        timeout-minutes: 15
        run: |
          python -m pip install "./clients/python[test]"
          scripts/run_with_servers.sh "$PWD/target/debug/ruvio" 17500 -- python -m pytest -q clients/python

  apps:
    if: inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',apps,')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            .
            clients/ruvio-client
            clients/ruvio-ui
      - name: C# layout rules
        run: dotnet run -c Release --project scripts/csharp-format -- --check
      - name: Build every .NET project
        run: |
          set -euo pipefail
          mapfile -t projects < <(git ls-files '*.csproj')
          for project in "${projects[@]}"; do
            dotnet build -c Release "$project" --nologo
          done
      - run: cargo build --locked --bin ruvio
      # The tours call nearly every client method, against a standalone server and a 3-shard
      # cluster. Each tour gets fresh servers: one tour's keys would trip the other's checks.
      - name: C# tour
        run: |
          # shellcheck disable=SC2016 # the inner script expands its own variables
          scripts/run_with_servers.sh "$PWD/target/debug/ruvio" 17400 -- bash -c '
            set -euo pipefail
            for address in "$RUVIO_TEST_ADDR" "$RUVIO_CLUSTER_ADDR"; do
              dotnet run -c Release --project clients/csharp/Ruvio.Client.Tour -- 127.0.0.1 "${address##*:}"
            done'
      - name: Rust tour
        run: |
          # shellcheck disable=SC2016 # the inner script expands its own variables
          scripts/run_with_servers.sh "$PWD/target/debug/ruvio" 17420 -- bash -c '
            set -euo pipefail
            for address in "$RUVIO_TEST_ADDR" "$RUVIO_CLUSTER_ADDR"; do
              cargo run --locked --manifest-path clients/ruvio-client/Cargo.toml --example tour -- 127.0.0.1 "${address##*:}"
            done'
      - name: Site
        working-directory: site-next
        run: npm ci && npm run build
      - name: Operator UI
        run: |
          npm ci --prefix clients/ruvio-ui/web
          npm run build --prefix clients/ruvio-ui/web
          cargo build --locked --manifest-path clients/ruvio-ui/Cargo.toml

  fuzz:
    if: inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',fuzz,')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      # Also keeps the installed cargo-fuzz binary, so the install below is a no-op on a warm cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run resp_parsers -- -max_total_time=15

  asan:
    if: inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',asan,')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: "-Zsanitizer=address"
      ASAN_OPTIONS: "detect_leaks=1:detect_stack_use_after_return=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-nextest
      # One process per test, so a leak report names the test that leaked.
      - name: AddressSanitizer library tests
        run: cargo nextest run --profile asan --no-default-features --lib --target x86_64-unknown-linux-gnu
        timeout-minutes: 30

  # Measures the hot-path instruction counts on a GitHub runner and prints them as
  # a new benchmark/baselines/instructions.json. The PR gate compares against that
  # file, so it must come from the same kind of machine. Copy the printed JSON into
  # the file and commit it. Not part of "all".
  instruction-baseline:
    if: contains(format(',{0},', inputs.jobs), ',instruction-baseline,')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: iai
      # A stalled mirror download is cut after 30 s and retried, instead of waiting for minutes.
      - run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y valgrind
        timeout-minutes: 6
      - run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Measure and print the new baseline
        run: |
          set -euo pipefail
          cargo bench --locked --bench hot_path 2>&1 | tee bench.log
          python3 scripts/check_instruction_baseline.py --update bench.log
          cpu="$(lscpu | sed -n 's/^Model name: *//p')"
          echo "::notice title=Instruction baseline (${cpu})::$(tr -d ' \n' < benchmark/baselines/instructions.json)"
          { echo "CPU: ${cpu}"; echo '```json'; cat benchmark/baselines/instructions.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Miri interprets every instruction, so it only runs where it adds what the other jobs
  # cannot: the unsafe code of the hash-table fork, through its own tests and those of the
  # slot tables built on it, with the sizes cut down under `cfg(miri)`. Safe code gains
  # nothing here (the test job runs it), and Miri cannot run the FFI code (Lua, mimalloc,
  # sockets); the ASan job covers that.
  miri:
    if: inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',miri,')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
      PROPTEST_CASES: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - id: nightly
        run: echo "version=$(rustc +nightly -V | tr -cd '[:alnum:].-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ steps.nightly.outputs.version }}
      - run: cargo miri setup
      - name: Miri on the hash-table fork and the slot tables
        timeout-minutes: 10
        run: >-
          cargo miri test --no-default-features --lib --
          hashbrown:: slots::
          -Zunstable-options --report-time

# Started by hand from the Actions tab only.
