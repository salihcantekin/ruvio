name: PR gate

# Short, secret-free checks on each proposed change. These checks publish nothing; they can also be started by hand. The extended CI workflow
# remains manually dispatched for Docker, cross-platform, fuzz, and fault tests.
on:
  workflow_dispatch:
  # On dev a pull request may merge without first being updated with dev, so the merged result is checked here.
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Blog posts are Markdown under site-next/src/content/blog/ and touch no code, so a change that
  # only edits them skips every job below. A skipped job counts as passed for the required checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A manual run, a new branch or a base that cannot be fetched runs everything.
          if [ -z "${BASE:-}" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qv '^site-next/src/content/blog/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only blog posts changed; skipping the checks."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      # Each test in its own process with a time limit (.config/nextest.toml): a hang fails
      # with the test's name instead of holding the job.
      - run: cargo nextest run --locked --profile ci --lib --bins --tests
        timeout-minutes: 20
      # Standards tests, matrix drift and the zero-cost guards; reuses the build above.
      - run: scripts/check.sh
      - run: python3 scripts/test_benchmark_regression.py
      - run: python3 tests/soak/test_soak.py
      # A job is billed by the started minute, so this few-second check rides along here.
      - run: python3 scripts/check_package_metadata.py

  instruction-count:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: iai
      # A stalled mirror download is cut after 30 s and retried, instead of waiting for minutes.
      - run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y valgrind
        timeout-minutes: 6
      - run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Hot-path instruction counts (+2% limit)
        run: |
          set -euo pipefail
          cargo bench --locked --bench hot_path 2>&1 | tee bench.log
          python3 scripts/check_instruction_baseline.py bench.log

  # Licenses, banned crates and sources do not change under a pull request that leaves the
  # dependencies alone, so this check is repeatable. Advisories change every day and run in the
  # nightly workflow instead; a new RustSec entry must not fail an unrelated pull request.
  supply-chain:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses sources
      - run: python3 scripts/test_supply_chain.py

  rust-client-and-cluster:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: cluster-server
          workspaces: |
            .
            clients/ruvio-client
      - run: cargo fmt --manifest-path clients/ruvio-client/Cargo.toml --all -- --check
      - run: cargo build --locked --bin ruvio
      # Without RUVIO_TEST_ADDR the live tests return early and pass, so run them against
      # real servers (standalone plus a 3-shard cluster).
      - name: Rust client tests against a live server
        run: scripts/run_with_servers.sh "$GITHUB_WORKSPACE/target/debug/ruvio" 17400 -- cargo test --manifest-path clients/ruvio-client/Cargo.toml --locked
      # The TLS tests need the `tls` feature and the TLS servers the script starts.
      - name: Rust client over TLS against live servers
        run: scripts/run_with_servers.sh "$GITHUB_WORKSPACE/target/debug/ruvio" 17400 -- cargo test --manifest-path clients/ruvio-client/Cargo.toml --features tls --test tls_live --locked
      - name: Verify shard routing and live Rust client
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          # On a failure the server log is printed before the data directory is removed.
          trap 'status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat "$data_dir/server.log" >&2 || true; fi; rm -rf "$data_dir"' EXIT
          export RUVIO_ADDR=127.0.0.1:16382
          export RUVIO_SHARDS=2
          export RUVIO_PORT_MODE=per-shard
          export RUVIO_DURABILITY=memory
          export RUVIO_DATA_DIR="$data_dir"
          (cd "$data_dir" && "$GITHUB_WORKSPACE/target/debug/ruvio") > "$data_dir/server.log" 2>&1 &
          server_pid=$!
          python3 scripts/cluster_smoke.py --base-port 16382
          RUVIO_CLUSTER_ADDR=127.0.0.1:16382 \
            cargo test --manifest-path clients/ruvio-client/Cargo.toml --locked \
              --test cluster_live -- --test-threads=1

  # Live tests are skipped without RUVIO_TEST_ADDR, so the C# client and the .NET
  # integrations run against the shared server binary.
  dotnet-client:
    needs: [changes, server-binary]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ruvio-server
          path: server-bin
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('clients/csharp/**/*.csproj', 'integrations/dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: chmod +x server-bin/ruvio
      - name: C# client and .NET integrations against a live server
        run: |
          scripts/run_with_servers.sh "$PWD/server-bin/ruvio" 17400 -- bash -euo pipefail -c '
            dotnet test clients/csharp/Ruvio.Client.Tests/Ruvio.Client.Tests.csproj --nologo --blame-hang-timeout 5m
            dotnet test clients/csharp/Ruvio.Client.AspNetCore.Tests/Ruvio.Client.AspNetCore.Tests.csproj --nologo --blame-hang-timeout 5m
            for project in integrations/dotnet/*Tests/*Tests.csproj; do
              dotnet test "$project" --nologo --blame-hang-timeout 5m
            done
          '

  go-client:
    needs: [changes, server-binary]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ruvio-server
          path: server-bin
      # The go.mod version is the supported floor, so test on it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - run: chmod +x server-bin/ruvio
      - run: go vet ./...
        working-directory: clients/go
      - name: Test against a live server
        run: scripts/run_with_servers.sh "$PWD/server-bin/ruvio" 17400 -- go -C clients/go test -count=1 -timeout 300s ./...

  # The C#, Go, Node, Python and Java client suites need a live server (standalone
  # and a 3-shard cluster), so the server is built once and shared as an artifact.
  server-binary:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Built on 24.04 so the binary also runs on the 24.04 python-client job (a binary built on a newer glibc would not).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: cluster-server
      - run: cargo build --locked --bin ruvio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruvio-server
          path: target/debug/ruvio
          retention-days: 1

  node-client:
    needs: [changes, server-binary]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ruvio-server
          path: server-bin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      - run: chmod +x server-bin/ruvio
      - run: npm ci
        working-directory: clients/node
      - name: Build and test against a live server
        run: scripts/run_with_servers.sh "$PWD/server-bin/ruvio" 17400 -- npm test --prefix clients/node
      - name: Check the package contents
        run: npm pack --dry-run
        working-directory: clients/node
      # The site's setup wizard: its engine's tests, then every setup it can write through
      # this server's --check-config and coordinator --check. Needs no npm install.
      - name: Setup wizard
        run: |
          node --test site-next/scripts/wizard.test.mjs
          node site-next/scripts/check-wizard.mjs server-bin/ruvio

  python-client:
    needs: [changes, server-binary]
    if: needs.changes.outputs.code == 'true'
    # setup-python has no Python 3.9 for ubuntu-latest (26.04); the package still supports 3.9.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ruvio-server
          path: server-bin
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: chmod +x server-bin/ruvio
      - run: python -m pip install "./clients/python[test]" build twine
      - name: Test against a live server
        run: scripts/run_with_servers.sh "$PWD/server-bin/ruvio" 17400 -- python -m pytest -q clients/python
      - name: Build and check the distribution
        run: |
          python -m build --outdir dist-py clients/python
          python -m twine check dist-py/*

  java-client:
    needs: [changes, server-binary]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ruvio-server
          path: server-bin
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x server-bin/ruvio
      - name: Generated files match their sources
        run: python3 clients/java/tools/generate.py --check
      - name: Test against a live server, build sources and javadoc jars
        run: scripts/run_with_servers.sh "$PWD/server-bin/ruvio" 17400 -- mvn -B -f clients/java/pom.xml verify
