[package]
name = "ruvio-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
authors = ["Salih Cantekin <17653555+salihcantekin@users.noreply.github.com>"]
description = "Operator console for Ruvio. The browser talks HTTP; RESP goes through ruvio-client."
license = "AGPL-3.0-only"
publish = false

[dependencies]
include_dir = "0.7"
ruvio-client = { path = "../ruvio-client", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
